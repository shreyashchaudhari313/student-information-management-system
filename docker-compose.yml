      - MONGODB_URI=mongodb+srv://newuser:shreyass1234@cluster0.ybz8bqf.mongodb.net/studentDB?retryWrites=true&w=majority
      - FRONTEND_URL=http://localhost:5173,http://localhost:3000,https://campus-desk-sis-shreyas-3451.vercel.app,https://campus-desk-sis-v2-shreyas-3451.vercel.app
